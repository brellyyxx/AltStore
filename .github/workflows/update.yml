name: Update AltStore Source

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate AltStore source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request

          apps = [
              {
                  "name": "MSM",
                  "repo": "brellyyxx/MSM",
                  "bundleIdentifier": "com.brellyyxx.MSM"
              },
              {
                  "name": "Questify",
                  "repo": "brellyyxx/Questify",
                  "bundleIdentifier": "com.brellyyxx.Questify"
              },
              {
                  "name": "FoodCore",
                  "repo": "brellyyxx/FoodCore",
                  "bundleIdentifier": "com.brellyyxx.FoodCore"
              }
          ]

          headers = {
              "User-Agent": "AltStore-Source-Updater",
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"]
          }

          output = {
              "name": "Apps",
              "identifier": "com.brellyyxx.altstore",
              "apps": []
          }

          for app in apps:
              url = f"https://api.github.com/repos/{app['repo']}/releases/latest"
              request = urllib.request.Request(url, headers=headers)

              with urllib.request.urlopen(request) as response:
                  release = json.load(response)

              ipa = next(
                  asset for asset in release["assets"]
                  if asset["name"].lower().endswith(".ipa")
              )

              output["apps"].append({
                  "name": app["name"],
                  "bundleIdentifier": app["bundleIdentifier"],
                  "developerName": "brellyyxx",
                  "version": release["tag_name"].lstrip("v"),
                  "versionDate": release["published_at"],
                  "downloadURL": ipa["browser_download_url"],
                  "localizedDescription": release["body"] or app["name"]
              })

          with open("apps.json", "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2, ensure_ascii=False)

          print("apps.json updated")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update AltStore source"
            git push
          fi
